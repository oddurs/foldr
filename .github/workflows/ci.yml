name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all --check
      - name: Check lints
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo +${{ matrix.toolchain }} build --workspace --locked
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --workspace --locked
      - name: Check CLI entry points
        shell: bash
        run: |
          target/debug/foldr --help
          test "$(target/debug/foldr --version)" = "foldr 0.1.0"
          if target/debug/foldr --unknown-option; then
            echo "An unknown option should fail."
            exit 1
          fi
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc --workspace --no-deps --locked
