name: Packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build and package
        run: bash scripts/package.sh ${{ matrix.target }}
      - name: Verify packaged CLI
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c ./*.sha256)
          else
            (cd dist && shasum -a 256 -c ./*.sha256)
          fi
          mkdir unpacked
          tar -xzf dist/foldr-*.tar.gz -C unpacked
          package_dir=$(find unpacked -mindepth 1 -maxdepth 1 -type d)
          test -f "$package_dir/LICENSE"
          test -s "$package_dir/share/man/man1/foldr.1"
          test -s "$package_dir/share/zsh/site-functions/_foldr"
          "$package_dir/bin/foldr" --version
          python3 scripts/verify-cli.py "$package_dir/bin/foldr"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: foldr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
