[workspace]
members = ["crates/foldr-core", "crates/foldr-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/oddurs/foldr"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
foldr-core = { path = "crates/foldr-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
